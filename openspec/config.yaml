# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: TypeScript, NestJS, PostgreSQL, Stripe, Prisma  
  API style: RESTful, documented in docs/api.md
  Testing: Jest + NestJS Testing Library
  Architecture & Billing Standards:
  - We value backwards compatibility for all public APIs.
  - Idempotency is strictly required for all mutation/payment endpoints.
  - All Stripe webhooks must verify signatures and handle duplicate events safely.
  - Strict ACID transactions via Prisma for all billing/subscription state changes.
  - Do NOT store raw credit card data (PCI-DSS compliance scope).

rules:
  proposal:
    - |
      CRITICAL TEMPLATE RULE: You MUST use the EXACT following markdown structure for the Impact section in your output. Do not skip any fields.
      
      ## Impact
      - **Impacted Business Components**: [List PRD, teams, services, APIs, DB schemas, queues/workers]
      - **Impacted Infrastructure**: [List configs, monitoring, logging, metrics]
      - **Security & Compliance Impact (PII, PCI-DSS)**: [Explicitly address impacts]
      - **Rollback Plan & Data Migration Strategy**: [Detail rollback and safe migration]
      - **Specific Impacted File Paths**: [MUST explicitly list all file paths like src/app.module.ts]
  specs:
    - Use Given/When/Then format for all scenarios.
    - Reference existing architectural patterns before inventing new ones.
    - MUST include failure scenarios (e.g., Stripe API timeouts, rate limits, card_declined).
    - MUST explicitly define State Machine transitions for payment/subscription entities.
    - Detail webhook event handling if the feature relies on async Stripe events.

operations:
  apply:
    guidance:
      - Run focused tests before the full suite.
      - Ensure defensive programming around third-party API calls (try/catch, retries).
  archive:
    guidance:
      - Keep the completion summary concise.
      - Highlight any new Stripe webhook events introduced.